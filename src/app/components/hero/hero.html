<section id="top" class="hero section">
  <div class="container hero__inner">
    <div class="hero__avatar" [class.hero__avatar--empty]="!profile.photoUrl">
      @if (profile.photoUrl) {
        <img [src]="profile.photoUrl" [alt]="profile.fullName" />
      } @else {
        <span>{{ profile.fullName.charAt(0) }}</span>
      }
    </div>

    <h1 class="hero__name">{{ profile.fullName }}</h1>
    <p class="hero__title">{{ profile.title }}</p>
    <p class="hero__location">{{ profile.location }}</p>
    <p class="hero__summary">{{ profile.summary }}</p>

    <div class="hero__actions">
      <a class="btn btn--primary" href="#contact">Get in touch</a>
      <a class="btn btn--outline" href="#experience">View experience</a>
    </div>
  </div>
</section>
